[package]
name = "sloptopop-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
description = "sloptopop local: the open-source half of sloptopop on your machine. Builds the masked snapshot, applies the changes the sloptopop server verified as commits on a branch, and runs your project's own checks as evidence"
repository = "https://github.com/sloptopop/local-engine"

[lib]
name = "sloptopop_local"
path = "src/lib.rs"

[[bin]]
name = "sloptopop-local"
path = "src/main.rs"
# main.rs has no unit tests; an empty test harness would show main as uncovered.
test = false

# Open source only (D-0183): no sloptopop proprietary crate, ever
# (tests/open-source-only.rs checks the dependency tree).
[dependencies]
blake3 = "=1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Lint policy shared by every sloptopop Rust repo.
# Keep this block identical across repos; change it everywhere at once.
# `warnings = "deny"` turns every warning, including Clippy's, into a compile
# error; .cargo/config.toml runs Clippy as part of every build.
# Exceptions go through #[expect(lint, reason = "...")], never #[allow].

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
unit_bindings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
# cargo-llvm-cov sets cfg(coverage); declare it so it is not an unknown cfg.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"] }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Panics: errors must be handled, not crashed on.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
# Leftover debugging; write through a handle so broken pipes are errors, not panics.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Lint suppression must be explained and must stay necessary.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Correctness smells.
wildcard_enum_match_arm = "deny"
string_slice = "deny"
exit = "deny"
mem_forget = "deny"
lossy_float_literal = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
clone_on_ref_ptr = "deny"
rc_mutex = "deny"
infinite_loop = "deny"
missing_assert_message = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
